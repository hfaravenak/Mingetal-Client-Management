eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    system:
      enabled: false
    enable:
      all: false

spring:
  devtools:
    restart:
      aditional-paths: src/main/java
  application:
    name: productos
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    plataform: postgres
    driver-class-name: org.postgresql.Driver
    dbname: productos
    url: jdbc:postgresql://localhost:5432/productos
    username: postgres
    password: admin
  cloud:
    config:
      enabled: true
      uri: http://config:8081